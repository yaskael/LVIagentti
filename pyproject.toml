[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvi-mcp"
version = "0.1.0"
description = "MCP server for Finnish LVI (HVAC) IFC classification using LVI-TUOTEOSA codelist"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "ifcopenshell>=0.7.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
lvi-mcp = "lvi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lvi_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
